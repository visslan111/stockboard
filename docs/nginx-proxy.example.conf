# ============================================================
#  StockBoard 行情同源反代示例（Nginx）
#  放到 /etc/nginx/conf.d/ 下即可，按需改 server_name / root / 端口
#
#  作用：
#    1) 消除跨域，前端统一走 /api/ 前缀
#    2) 规避云厂商 WAF 对客户端 IP 段的拦截（服务器出口侧通常正常）
#    3) 15 秒内重复请求走本地缓存，降低上游频次
#
#  安全：只放行固定前缀，只允许 GET，不做通用正向代理
# ============================================================

# 缓存区（放 http 上下文；conf.d 下的文件本身就是 http 上下文，可直接写）
proxy_cache_path /var/cache/nginx/quote levels=1:2 keys_zone=quote_cache:32m
                 max_size=512m inactive=10m use_temp_path=off;

server {
    listen 80;
    server_name your.domain.com;

    root /var/www/stockboard;
    index index.html;

    # ---------- 静态站 ----------
    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源短缓存（改版后记得给文件名加版本号或清缓存）
    location ~* \.(js|css|png|jpg|svg)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # ---------- 腾讯：前复权日K（newfqkline） ----------
    location ^~ /api/qq/ {
        limit_except GET { deny all; }
        rewrite ^/api/qq/(.*)$ /$1 break;
        proxy_pass https://proxy.finance.qq.com;

        proxy_ssl_server_name on;
        proxy_ssl_name proxy.finance.qq.com;
        proxy_set_header Host proxy.finance.qq.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36";
        proxy_set_header Referer "https://gu.qq.com/";
        proxy_set_header Accept-Encoding "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 8s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_cache quote_cache;
        proxy_cache_key "qq|$request_uri";
        proxy_cache_valid 200 15s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        default_type application/json;
        add_header X-Quote-Cache $upstream_cache_status always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }

    # ---------- 腾讯：分时 / 不复权K / 逐分钟成交额 ----------
    location ^~ /api/qq2/ {
        limit_except GET { deny all; }
        rewrite ^/api/qq2/(.*)$ /$1 break;
        proxy_pass https://web.ifzq.gtimg.cn;

        proxy_ssl_server_name on;
        proxy_ssl_name web.ifzq.gtimg.cn;
        proxy_set_header Host web.ifzq.gtimg.cn;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36";
        proxy_set_header Referer "https://gu.qq.com/";
        proxy_set_header Accept-Encoding "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 8s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_cache quote_cache;
        proxy_cache_key "qq2|$request_uri";
        proxy_cache_valid 200 10s;

        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }

    # ---------- 腾讯：实时报价（GBK，前端自行转码） ----------
    location ^~ /api/qt/ {
        limit_except GET { deny all; }
        rewrite ^/api/qt/(.*)$ /$1 break;
        proxy_pass https://qt.gtimg.cn;

        proxy_ssl_server_name on;
        proxy_ssl_name qt.gtimg.cn;
        proxy_set_header Host qt.gtimg.cn;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36";
        proxy_set_header Referer "https://gu.qq.com/";
        proxy_set_header Accept-Encoding "";

        proxy_connect_timeout 8s;
        proxy_read_timeout 10s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_cache quote_cache;
        proxy_cache_key "qt|$request_uri";
        proxy_cache_valid 200 3s;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }

    # ---------- 东财：实时 / 板块 / 资金（push2） ----------
    # 若遇到 502、upstream prematurely closed connection（东财按 TLS 指纹拦截 nginx），
    # 改用 tools/em-gw.py 起本地网关，然后 proxy_pass http://127.0.0.1:8099; 见 DEPLOY.md
    location ^~ /api/em/ {
        limit_except GET { deny all; }
        rewrite ^/api/em/(.*)$ /$1 break;
        proxy_pass https://push2.eastmoney.com;

        proxy_ssl_server_name on;
        proxy_ssl_name push2.eastmoney.com;
        proxy_set_header Host push2.eastmoney.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36";
        proxy_set_header Referer "https://quote.eastmoney.com/";
        proxy_set_header Accept-Encoding "";

        proxy_connect_timeout 8s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_cache quote_cache;
        proxy_cache_key "em|$request_uri";
        proxy_cache_valid 200 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;

        default_type application/json;
        add_header X-Quote-Cache $upstream_cache_status always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }

    # ---------- 东财：历史 K 线 / 历史资金（push2his） ----------
    location ^~ /api/emh/ {
        limit_except GET { deny all; }
        rewrite ^/api/emh/(.*)$ /$1 break;
        proxy_pass https://push2his.eastmoney.com;

        proxy_ssl_server_name on;
        proxy_ssl_name push2his.eastmoney.com;
        proxy_set_header Host push2his.eastmoney.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36";
        proxy_set_header Referer "https://quote.eastmoney.com/";
        proxy_set_header Accept-Encoding "";

        proxy_connect_timeout 8s;
        proxy_read_timeout 20s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_cache quote_cache;
        proxy_cache_key "emh|$request_uri";
        proxy_cache_valid 200 60s;

        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }

    # ---------- 健康检查 ----------
    location = /api/ping {
        default_type application/json;
        return 200 '{"ok":true}';
    }
}
